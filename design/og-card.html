<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sunghong Park — link preview card (1200 × 630)</title>
<!--
  Editable source of design/og-card.png, in the site's "Signal Graph" palette.
  Re-create the PNG after editing (any Chromium-based browser):
    chromium --headless --hide-scrollbars --window-size=1200,630 --screenshot=design/og-card.png design/og-card.html
  Then run scripts/build.py so the image is copied to site/assets/.
-->
<style>
@font-face{font-family:"Space Grotesk";font-weight:300 700;src:url("fonts/space-grotesk-latin-wght-normal.woff2") format("woff2")}
@font-face{font-family:"Inter";font-weight:100 900;src:url("fonts/inter-latin-wght-normal.woff2") format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:100 800;src:url("fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2")}
:root{--paper:#F1F3F4;--ink:#3A3D44;--sky:#9CC6E0;--azure:#0297DE;--coral:#FC734D;--red:#E4002B}
*{box-sizing:border-box}
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background-color:var(--ink);background-image:radial-gradient(rgba(241,243,244,.16) 1px,transparent 1.5px);background-size:24px 24px;color:var(--paper);font-family:"Inter","Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.card{position:relative;display:flex;flex-direction:column;height:100%;padding:64px 72px}
.eyebrow{display:flex;align-items:center;gap:14px;margin:0;font-family:"JetBrains Mono",Consolas,monospace;font-size:18px;font-weight:500;line-height:1.4;letter-spacing:.1em;text-transform:uppercase}
.eyebrow::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--coral);flex:none}
h1{margin:64px 0 0;font-family:"Space Grotesk","Segoe UI",sans-serif;font-size:60px;font-weight:600;line-height:1.08;letter-spacing:-.04em}
h1 span{color:var(--coral)}
.role{margin:28px 0 0;font-size:24px;font-weight:500;line-height:1.4;color:rgba(241,243,244,.84)}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:auto;padding-top:22px;border-top:2px solid var(--paper);font-size:20px;font-weight:500;line-height:1.4}
.bottom span+span{font-family:"JetBrains Mono",Consolas,monospace;font-size:18px;letter-spacing:.04em}
.graph{position:absolute;right:56px;top:72px;width:330px;height:298px}
.edges{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.bridges{fill:none;stroke:var(--paper);stroke-width:3.5;stroke-linecap:round}
.nodes{fill:var(--paper);stroke:var(--ink);stroke-width:2.4}
.nodes-solid{fill:var(--ink)}
.centers{fill:var(--ink);stroke:var(--paper);stroke-width:3}
.hub-word{font-family:"Space Grotesk","Segoe UI",sans-serif;font-size:30px;font-weight:700;fill:var(--ink)}
</style>
</head>
<body>
<div class="card">
<p class="eyebrow">Graph learning × Biomedical AI</p>
<h1>Sunghong Park<br><span>Learning from connections.</span></h1>
<p class="role">Ph.D. · Postdoctoral Researcher · KAIST</p>
<div class="bottom"><span>Research · Publications · Projects</span><span>sunghongpark.ai</span></div>

</svg>
</div>
</body>
</html>
