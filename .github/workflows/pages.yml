name: Build and deploy research website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Set the repository variable SITE_URL to https://sunghongpark.ai only
      # after buying/verifying the domain and configuring Pages and DNS.
      SITE_URL: ${{ vars.SITE_URL || 'https://sunghongpark-ai.github.io' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static pages
        run: python3 scripts/build.py --base-url "$SITE_URL"
      - name: Validate internal links and metadata
        run: python3 scripts/validate.py
      - name: Upload generated website only
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
